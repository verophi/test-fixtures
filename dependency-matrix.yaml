# verophi test-fixtures dependency matrix
# Assertion input for verophi-inttest.
# CVE data from OSV.dev, June 2026.

packages:
  # --- npm ---
  - name: lodash
    ecosystem: npm
    from: "4.17.20"
    to: "4.17.21"
    bump: patch
    cves:
      - id: CVE-2021-23337
        description: Command Injection
        severity: high
        fixed_by_to: true
      - id: CVE-2020-28500
        description: ReDoS
        severity: medium
        fixed_by_to: true
      - id: CVE-2025-13465
        description: Prototype Pollution
        severity: high
        fix_version: "4.17.23"
        fixed_by_to: false  # Cap too low
      - id: CVE-2026-2950
        severity: medium
        fix_version: "4.18.0"
        fixed_by_to: false
      - id: CVE-2026-4800
        severity: high
        fix_version: "4.18.0"
        fixed_by_to: false

  - name: minimist
    ecosystem: npm
    from: "1.2.5"
    to: "1.2.6"
    bump: patch
    cves:
      - id: CVE-2021-44906
        description: Prototype Pollution
        severity: medium
        fixed_by_to: true

  - name: express
    ecosystem: npm
    from: "4.17.1"
    to: "4.21.0"
    bump: minor
    cves: []  # No CVE — tests MR without security impact

  # --- Python ---
  - name: PyYAML
    ecosystem: python
    from: "5.3.1"
    to: "6.0"
    bump: major
    cves:
      - id: CVE-2020-14343
        description: Arbitrary Code Execution
        severity: medium
        fix_version: "5.4"
        fixed_by_to: true

  - name: Pillow
    ecosystem: python
    from: "9.0.0"
    to: "10.2.0"
    bump: major
    cves:
      - id: multiple
        description: "14 CVEs (diverse)"
        severity: critical
        fixed_by_to: partial

  - name: requests
    ecosystem: python
    from: "2.31.0"
    to: "2.32.0"
    bump: patch
    enabled: false  # Disabled in renovate.json
    cves:
      - id: CVE-2024-35195
        description: Session leak on redirect
        severity: medium
        fixed_by_to: true

  # --- Go ---
  - name: golang.org/x/net
    ecosystem: go
    from: "0.16.0"
    to: "0.33.0"
    bump: minor
    cves:
      - id: CVE-2023-44487
        description: HTTP/2 Rapid Reset
        severity: high
        fix_version: "0.17.0"
        fixed_by_to: true
      - id: multiple
        description: "19 CVEs total"
        severity: high
        fixed_by_to: true

  - name: golang.org/x/crypto
    ecosystem: go
    from: "0.16.0"
    to: "0.31.0"
    bump: minor
    cves:
      - id: CVE-2023-48795
        description: Terrapin
        severity: medium
        fix_version: "0.17.0"
        fixed_by_to: true
      - id: multiple
        description: "24 CVEs total"
        severity: high
        fixed_by_to: true

  - name: github.com/gin-gonic/gin
    ecosystem: go
    from: "1.7.0"
    to: "1.9.1"
    bump: minor
    cves:
      - id: CVE-2023-26125
        description: Improper Input Validation
        severity: medium
        fixed_by_to: true
      - id: multiple
        description: "5 CVEs total"
        severity: high
        fixed_by_to: true

  # --- Maven ---
  - name: org.apache.logging.log4j:log4j-core
    ecosystem: maven
    from: "2.14.1"
    to: "2.17.1"
    bump: minor
    cves:
      - id: CVE-2021-44228
        description: Log4Shell
        severity: critical
        fixed_by_to: true
      - id: CVE-2021-45046
        description: Incomplete fix for Log4Shell
        severity: critical
        fixed_by_to: true
      - id: multiple
        description: "7 CVEs total"
        severity: critical
        fixed_by_to: true

  # --- Rust ---
  - name: rustls
    ecosystem: rust
    from: "0.20.8"
    to: "0.21.11"
    bump: minor
    sbom_coverage: false  # Trivy does not map GHSA to rustls 0.20.x
    cves:
      - id: GHSA-6g7w-8wpp-frhj
        description: infinite loop via close_notify
        severity: high
        fix_version: "0.21.11"
        fixed_by_to: true

  - name: tokio
    ecosystem: rust
    from: "1.17.0"
    to: "1.27.0"
    bump: minor
    sbom_coverage: false  # Trivy filters Windows-only advisory
    cves:
      - id: GHSA-7rrj-xr53-82p7
        description: reject_remote_clients config corruption
        severity: low
        fixed_by_to: true
      - id: multiple
        description: "6 advisories total"
        severity: medium
        fixed_by_to: true

  # --- Ruby ---
  - name: actionpack
    ecosystem: ruby
    from: "6.1.4"
    to: "6.1.7.8"
    bump: patch
    cves:
      - id: multiple
        description: "11 Rails CVEs"
        severity: high
        fixed_by_to: true

  # --- NuGet ---
  - name: Newtonsoft.Json
    ecosystem: nuget
    from: "12.0.3"
    to: "13.0.3"
    bump: major
    sbom_coverage: false  # Trivy NuGet advisory DB incomplete
    cves:
      - id: GHSA-5crp-9r3c-p9vr
        description: DoS via deep nesting
        severity: high
        fixed_by_to: true

  - name: System.Text.Json
    ecosystem: nuget
    from: "6.0.0"
    to: "8.0.5"
    bump: major
    sbom_coverage: false  # Trivy NuGet advisory DB incomplete
    cves:
      - id: GHSA-8g4q-xg66-9fp4
        description: DoS via JsonExtensionData
        severity: high
        fixed_by_to: true

  # --- PHP ---
  - name: guzzlehttp/guzzle
    ecosystem: php
    from: "7.4.0"
    to: "7.8.0"
    bump: minor
    cves:
      - id: multiple
        description: "5 CVEs (SSRF, Header Injection)"
        severity: high
        fixed_by_to: true

  # --- Elixir ---
  - name: phoenix
    ecosystem: elixir
    from: "1.6.0"
    to: "1.7.0"
    bump: minor
    sbom_coverage: false  # Trivy has no Hex advisory database
    cves:
      - id: GHSA-p8f7-22gq-m7j9
        description: Token Leakage
        severity: medium
        fixed_by_to: true

  # --- Dart ---
  - name: dio
    ecosystem: dart
    from: "4.0.0"
    to: "5.0.0"
    bump: major
    cves:
      - id: CVE-2021-31402
        description: CRLF Injection
        severity: high
        fixed_by_to: true

  # --- Swift ---
  - name: apple/swift-nio-http2
    ecosystem: swift
    from: "1.25.0"
    to: "1.28.0"
    bump: minor
    sbom_coverage: false  # Trivy has no Swift advisory database
    cves:
      - id: CVE-2023-44487
        description: HTTP/2 Rapid Reset
        severity: high
        fixed_by_to: true

  # --- npm (grouped: CASE-GROUP-1) ---
  - name: axios
    ecosystem: npm
    from: "0.21.1"
    to: "0.21.4"
    bump: patch
    case: GROUP-1
    cves:
      - id: CVE-2021-3749
        description: ReDoS
        severity: high
        fix_version: "0.21.2"
        fixed_by_to: true

  - name: tough-cookie
    ecosystem: npm
    from: "4.1.2"
    to: "4.1.3"
    bump: patch
    case: GROUP-1
    cves:
      - id: CVE-2023-26136
        description: Prototype Pollution
        severity: medium
        fix_version: "4.1.3"
        fixed_by_to: true

  - name: semver
    ecosystem: npm
    from: "7.3.7"
    to: "7.5.2"
    bump: minor
    case: GROUP-1
    cves:
      - id: CVE-2022-25883
        description: ReDoS
        severity: high
        fix_version: "7.5.2"
        fixed_by_to: true

  # --- npm (pin: CASE-PIN-1, CASE-PIN-2) ---
  - name: json5
    ecosystem: npm
    from: "^2.2.1"
    to: "2.2.3"
    bump: pin
    case: PIN-1
    sbom_coverage: false  # Lockfile version already fixed, Trivy finds no vuln
    cves:
      - id: CVE-2022-46175
        description: Prototype Pollution via Parse
        severity: high
        fix_version: "2.2.2"
        fixed_by_to: true

  - name: ws
    ecosystem: npm
    from: "^7.5.9"
    to: "7.5.11"
    bump: pin
    case: PIN-2
    sbom_coverage: false  # Lockfile version already fixed, Trivy finds no vuln
    cves:
      - id: CVE-2024-37890
        description: DoS via HTTP headers
        severity: high
        fix_version: "7.5.10"
        fixed_by_to: true

  # --- Docker ---
  - name: nginx
    ecosystem: docker
    from: "1.24-alpine"
    to: "1.25"
    bump: minor
    sbom_coverage: false  # trivy fs does not scan Dockerfiles for image vulns
    cves:
      - id: CVE-2025-23419
        description: TLS session resumption bypass
        severity: medium
        fixed_by_to: true

  - name: node
    ecosystem: docker
    from: "20-alpine"
    to: pinDigest
    bump: pinDigest
    sbom_coverage: false  # trivy fs does not scan Dockerfiles for image vulns
    cves: []  # Tests pinDigest updateType, no CVE correlation

summary:
  ecosystems: 12
  packages_total: 26
  cve_fixing_updates: 23
  updates_without_cve: 2  # express, node pinDigest
  update_types:
    patch: 8
    minor: 10
    major: 6
    pin: 2
    pinDigest: 1
  unfixable_cves: 3  # lodash (cap too low for 4.17.23/4.18.0)
  cases:
    GROUP-1: [axios, tough-cookie, semver]
    PIN-1: [json5]
    PIN-2: [ws]
